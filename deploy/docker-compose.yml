# ReportSDState / CampusAlert: site + API + Cloudflare Tunnel on one machine.
#
# Secrets and data live OUTSIDE the git checkout (see deploy/README.md):
#   ../../secrets/backend.env   API settings and keys (chmod 600)
#   ../../secrets/tunnel.env    TUNNEL_TOKEN for this project's own tunnel (chmod 600)
#   ../../data/                 SQLite database and backups
#
# Run from this folder:  docker compose up -d --build
name: campus-alert

services:
  api:
    build:
      context: ../backend
    image: campus-alert-api:latest
    container_name: campus-alert-api
    # Run as the host user that owns ../../data so the database files stay editable.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    env_file: ../../secrets/backend.env
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
      WAITRESS_THREADS: "4"
    volumes:
      - ../../data:/app/instance
    expose:
      - "5000"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    build:
      context: ..
      dockerfile: deploy/web/Dockerfile
    image: campus-alert-web:latest
    container_name: campus-alert-web
    depends_on:
      api:
        condition: service_healthy
    # Local-only port for health checks from the server itself. The public path is the tunnel.
    ports:
      - "127.0.0.1:${WEB_PORT:-8100}:80"
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    container_name: campus-alert-tunnel
    command: tunnel --no-autoupdate run
    env_file: ../../secrets/tunnel.env
    depends_on:
      - web
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
